<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a20">
<title>Natalka · Wszystkiego najlepszego!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0f2a20;--green:#1f6b4f;--cream:#f6efe0;--paper:#fbf7ec;--ink:#1a1a17;
  --gold:#c9a24a;--gold-2:#e8cf8b;--coral:#e8745a;
  --serif:'Playfair Display','Times New Roman',serif;
  --serif-2:'Cormorant Garamond',Georgia,serif;
  --sans:'Montserrat',system-ui,sans-serif;
  --noise:url("img/noise.png");
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--serif-2);color:var(--cream);background:var(--forest);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 600px at 15% 10%,rgba(31,107,79,.55),transparent 60%),
             radial-gradient(800px 600px at 90% 85%,rgba(232,116,90,.2),transparent 60%),
             linear-gradient(180deg,var(--forest),#0b1f17)}
main,footer{position:relative;z-index:1}
section{position:relative;padding:clamp(50px,9vw,120px) 18px}

.floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}90%{opacity:.2}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}

/* ----- etykieta ----- */
.label{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--ink),0 30px 60px rgba(0,0,0,.45)}
.label::before{content:"";position:absolute;inset:10px;border:1px solid rgba(26,26,23,.45);pointer-events:none}
.dot{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--green);z-index:2}
.dot.tl{top:-8px;left:-8px}.dot.tr{top:-8px;right:-8px}.dot.bl{bottom:-8px;left:-8px}.dot.br{bottom:-8px;right:-8px}

/* ----- hero ----- */
.hero{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center}
.hero .label{width:min(640px,88vw);padding:clamp(34px,7vw,64px) clamp(20px,5vw,50px);animation:heroIn 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.emblem{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;position:relative;animation:spin 40s linear infinite}
.emblem::before{content:"";position:absolute;inset:6px;border:1px solid var(--ink);border-radius:50%}
.emblem svg{width:48px;height:48px;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-family:var(--serif);font-weight:500;line-height:.95;font-size:clamp(56px,16vw,130px);margin:8px 0 4px;color:var(--ink)}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(22px,5vw,32px);color:#2b2b27}
.rule{width:120px;height:1px;background:var(--ink);margin:22px auto;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--green);transform:translateX(-50%)}
.lead{font-size:clamp(21px,4.6vw,26px);line-height:1.35;margin-bottom:26px;color:#2d2d29}
.btn{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
  padding:18px 32px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);cursor:pointer;transition:.3s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--green);border-color:var(--green);transform:translateY(-3px)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--gold)}
.btn.ghost:hover{background:var(--gold);color:var(--ink)}

/* ----- wybór ----- */
.pick{text-align:center;padding-top:clamp(40px,7vw,90px)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-2)}
.pick h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8vw,64px);line-height:1.05;margin:14px 0 8px}
.pick h2 em{font-style:italic;color:var(--gold-2)}
.hint{font-family:var(--serif);font-style:italic;font-size:clamp(19px,4vw,24px);color:#d9d0b8;min-height:1.5em;transition:opacity .4s}

.cards{display:flex;justify-content:center;gap:clamp(22px,4vw,54px);margin:clamp(34px,5vw,70px) auto 10px;max-width:1150px;perspective:1600px}
.card-wrap{--w:clamp(230px,26vw,320px);width:var(--w);aspect-ratio:3/4;cursor:pointer;animation:float 5.5s ease-in-out infinite;flex:none}
.card-wrap:nth-child(2){animation-delay:-1.8s;animation-duration:6.4s}
.card-wrap:nth-child(3){animation-delay:-3.6s;animation-duration:5.9s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-20px) rotate(1.2deg)}}
.card-wrap.locked{animation-play-state:paused;cursor:default}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.4,1)}
@media (hover:hover){.card-wrap:not(.locked):hover .card{transform:rotateY(9deg) rotateX(-5deg) scale(1.04)}}
.card.flipped{transform:rotateY(180deg)!important}
/* UWAGA: filter na .card psuje 3D (spłaszcza obrót), więc przyciemniamy tylko tył */
.face.back{transition:filter .7s,visibility 0s .38s}
.card.dim .face.back{filter:brightness(.6) saturate(.7)}
/* Safari/iOS ignoruje backface-visibility przy zagnieżdżonych elementach: przełączamy strony ręcznie w połowie obrotu */
.face.back *{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.card.flipped .face.back{visibility:hidden}
.face.front{visibility:hidden;transition:visibility 0s .38s}
.card.flipped .face.front{visibility:visible}
#zoom .face.front{visibility:visible}

/* napięcie: coraz mocniejsze drżenie */
.card.tense{animation:tense 3.2s cubic-bezier(.4,0,.6,1) forwards}
.card.tense .back{animation:glow 3.2s ease-in forwards}
@keyframes tense{
  0%{transform:rotate(0) scale(1)}
  8%{transform:rotate(-2deg) scale(1.02)}16%{transform:rotate(2deg) scale(1.03)}
  24%{transform:rotate(-3deg) scale(1.04)}32%{transform:rotate(3deg) scale(1.05)}
  40%{transform:rotate(-4deg) scale(1.06)}48%{transform:rotate(4deg) scale(1.07)}
  56%{transform:rotate(-6deg) scale(1.08)}63%{transform:rotate(6deg) scale(1.09)}
  70%{transform:rotate(-8deg) scale(1.1)}76%{transform:rotate(8deg) scale(1.11)}
  82%{transform:rotate(-9deg) scale(1.12)}88%{transform:rotate(9deg) scale(1.13)}
  94%{transform:rotate(-6deg) scale(1.14)}100%{transform:rotate(0) scale(1.15)}
}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(232,207,139,0),0 26px 50px rgba(0,0,0,.5)}to{box-shadow:0 0 28px 8px rgba(232,207,139,.8),0 12px 24px rgba(0,0,0,.5)}}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

/* tył: zielona folia ze złotą siatką */
.face.back{
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);border-radius:6px;
  background:
    radial-gradient(circle at 50% 38%,rgba(232,207,139,.35),transparent 58%),
    repeating-linear-gradient(45deg,rgba(232,207,139,.20) 0 1px,transparent 1px 10px),
    repeating-linear-gradient(-45deg,rgba(232,207,139,.20) 0 1px,transparent 1px 10px),
    linear-gradient(155deg,#2a8a66,#12392b 55%,#0b2219);
  box-shadow:0 0 0 5px #0f2a20,0 0 0 7px var(--gold),0 12px 24px rgba(0,0,0,.5);
}
.face.back::before{content:"";position:absolute;inset:12px;border:1px solid var(--gold-2);border-radius:3px;opacity:.9}
.face.back::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.1;pointer-events:none}
.corner{position:absolute;width:26px;height:26px;border:2px solid var(--gold-2);z-index:2}
.corner.tl{top:20px;left:20px;border-right:0;border-bottom:0}.corner.tr{top:20px;right:20px;border-left:0;border-bottom:0}
.corner.bl{bottom:20px;left:20px;border-right:0;border-top:0}.corner.br{bottom:20px;right:20px;border-left:0;border-top:0}
.medal{width:62%;aspect-ratio:1;border-radius:50%;position:relative;z-index:2;
  background:radial-gradient(circle at 35% 30%,#fffaf0,#f1e2b4 70%,#d9bf7a);
  border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(15,42,32,.85),0 0 0 7px var(--gold-2),inset 0 0 18px rgba(120,90,20,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.medal .roman{font-family:var(--serif);font-weight:700;letter-spacing:.3em;font-size:calc(var(--w)/17);margin-bottom:2px;padding-left:.3em}
.medal .q{font-family:var(--serif);font-style:italic;font-size:calc(var(--w)/2.7);line-height:.9}
.shine{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.shine::after{content:"";position:absolute;top:-30%;left:-70%;width:45%;height:160%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:rotate(18deg);animation:shine 4.5s ease-in-out infinite}
.card-wrap:nth-child(2) .shine::after{animation-delay:-1.5s}.card-wrap:nth-child(3) .shine::after{animation-delay:-3s}
@keyframes shine{0%,55%{left:-70%}100%{left:140%}}

/* przód */
.face.front{
  --w:inherit;font-size:calc(var(--w)/18);
  transform:rotateY(180deg);display:flex;flex-direction:column;padding:.8em;gap:.7em;
  background:linear-gradient(160deg,#fffdf4,#f3e5b8);color:var(--ink);border-radius:6px;
  border:3px solid var(--gold);box-shadow:0 0 0 5px #f6e9c4,0 0 0 7px var(--gold),0 12px 26px rgba(0,0,0,.5);
}
.pic{flex:1;min-height:0;position:relative;border-radius:4px;overflow:hidden;border:1px solid rgba(26,26,23,.4);background:#1d3a2d}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:5em;background:linear-gradient(160deg,#2a8a66,#12392b)}
.info{text-align:center;padding-bottom:.2em}
.info h3{font-family:var(--serif);font-weight:700;font-size:1.75em;line-height:1.08;color:var(--ink)}
.info .val{margin-top:.5em;font-family:var(--sans);font-weight:700;font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:#7a5f1a}
.info .val.win{display:inline-block;margin-top:.55em;background:var(--coral);color:#fff;padding:.55em 1em;font-size:.95em;letter-spacing:.22em;transform:rotate(-2deg)}

.after{margin-top:26px;opacity:0;transform:translateY(16px);transition:.8s;pointer-events:none}
.after.show{opacity:1;transform:none;pointer-events:auto}
.after .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ----- powiększenie zwycięskiej karty ----- */
#veil{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,rgba(15,42,32,.78),rgba(3,10,7,.96));opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
#veil.on{opacity:1;visibility:visible}
#rays{position:fixed;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;z-index:51;pointer-events:none;opacity:0;transition:opacity 1s;
  background:repeating-conic-gradient(rgba(232,207,139,.2) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%);animation:spin 50s linear infinite}
#rays.on{opacity:1}
#zoom{--w:min(84vw,min(400px,52svh*.75*1.6));position:fixed;inset:0;margin:auto;z-index:52;width:var(--w);height:calc(var(--w)*4/3);visibility:hidden;will-change:transform}
#zoom .face.front{backface-visibility:visible;transform:none;position:absolute;inset:0;
  box-shadow:0 0 0 5px #f6e9c4,0 0 0 7px var(--gold),0 0 36px 6px rgba(232,207,139,.55),0 14px 30px rgba(0,0,0,.6)}
#zoom.float .face.front{animation:zfloat 3.6s ease-in-out infinite}
@keyframes zfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.ribbon{position:fixed;z-index:53;left:50%;top:calc(50% - var(--zh,300px)/2 - 34px);transform:translate(-50%,10px) scale(.7);opacity:0;transition:.6s cubic-bezier(.2,1.5,.4,1);
  font-family:var(--sans);font-weight:700;font-size:clamp(13px,3.6vw,16px);letter-spacing:.3em;text-transform:uppercase;background:var(--coral);color:#fff;padding:12px 24px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.ribbon.on{opacity:1;transform:translate(-50%,0) scale(1);animation:pulse 1.6s ease-in-out infinite .6s}
@keyframes pulse{50%{transform:translate(-50%,0) scale(1.07)}}
#close{position:fixed;z-index:53;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);opacity:0;visibility:hidden;transition:.6s;background:var(--gold);border-color:var(--gold);color:var(--ink)}
#close.on{opacity:1;visibility:visible}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

footer{text-align:center;padding:30px 20px 60px;font-family:var(--serif);font-style:italic;color:#b9b19a;font-size:20px}
footer span{color:var(--gold-2)}

/* ----- telefon: karty jedna pod drugą ----- */
@media (max-width:760px){
  section{padding-left:14px;padding-right:14px}
  .cards{flex-direction:row;align-items:center;justify-content:center;gap:14px;margin-top:40px}
  .card-wrap{--w:calc((100vw - 28px - 28px)/3)}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
  /* małe karty: ramki cieńsze */
  .face.back{border-width:1.5px;box-shadow:0 0 0 3px #0f2a20,0 0 0 4.5px var(--gold),0 8px 16px rgba(0,0,0,.5)}
  .face.back::before{inset:6px}
  .corner{width:11px;height:11px;border-width:1.5px}
  .corner.tl{top:11px;left:11px}.corner.tr{top:11px;right:11px}.corner.bl{bottom:11px;left:11px}.corner.br{bottom:11px;right:11px}
  .medal{width:66%;border-width:2px;box-shadow:0 0 0 3px rgba(15,42,32,.85),0 0 0 4.5px var(--gold-2),inset 0 0 10px rgba(120,90,20,.35)}
  .card-wrap .face.front{font-size:calc(var(--w)/10);padding:.45em;gap:.4em;border-width:2px;
    box-shadow:0 0 0 3px #f6e9c4,0 0 0 4.5px var(--gold),0 8px 16px rgba(0,0,0,.5)}
  .card-wrap .info h3{font-size:1.15em;line-height:1.1}
  .card-wrap .info .val{display:none}
  #zoom{--w:min(86vw,60svh*.75)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>

<main>
  <section class="hero">
    <div class="label">
      <i class="dot tl"></i><i class="dot tr"></i><i class="dot bl"></i><i class="dot br"></i>
      <div class="emblem">
        <svg viewBox="0 0 64 64" fill="none" stroke="#1a1a17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="16" y="10" width="32" height="8" rx="2"/><path d="M18 18c-4 4-6 8-6 14v18c0 4 3 6 6 6h28c3 0 6-2 6-6V32c0-6-2-10-6-14"/><path d="M20 36h24M20 44h24"/>
        </svg>
      </div>
      <h1>Natalka</h1>
      <div class="sub">Wszystkiego najlepszego!</div>
      <div class="rule"></div>
      <p class="lead">Nie mogłem wybrać prezentu.<br>Zdecyduj sama.</p>
      <a href="#pick" class="btn">Losuję</a>
    </div>
  </section>

  <section class="pick" id="pick">
    <div class="eyebrow">Trzy pomysły</div>
    <h2>Wybierz <em>jedną</em> kartę</h2>
    <p class="hint" id="hint">&nbsp;</p>

    <div class="cards" id="cards">
      <div class="card-wrap"><div class="card">
        <div class="face back"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="medal"><div class="roman">I</div><div class="q">?</div></div><div class="shine"></div></div>
        <div class="face front"></div></div></div>
      <div class="card-wrap"><div class="card">
        <div class="face back"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="medal"><div class="roman">II</div><div class="q">?</div></div><div class="shine"></div></div>
        <div class="face front"></div></div></div>
      <div class="card-wrap"><div class="card">
        <div class="face back"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="medal"><div class="roman">III</div><div class="q">?</div></div><div class="shine"></div></div>
        <div class="face front"></div></div></div>
    </div>

    <div class="after" id="after">
      <div class="row">
        <button class="btn ghost" id="again">Jeszcze raz</button>
        <button class="btn" id="seeprize">Mój prezent</button>
      </div>
    </div>
  </section>
</main>

<footer>Wszystkiego najlepszego, <span>Natalko</span> ♥</footer>

<div id="veil"></div>
<div id="rays"></div>
<div id="zoom"></div>
<div class="ribbon" id="ribbon">Wygrałaś!</div>
<button class="btn" id="close">Odbieram</button>
<canvas id="confetti"></canvas>

<script>
/* tło */
(function(){const f=document.getElementById('floaters'),it=['•','✦','·','✧'];
for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=it[i%4];s.style.left=Math.random()*100+'%';
s.style.fontSize=(10+Math.random()*20)+'px';s.style.color=i%3?'#e8cf8b':'#8fd1b0';
s.style.animationDuration=(14+Math.random()*18)+'s';s.style.animationDelay=(-Math.random()*30)+'s';f.appendChild(s)}})();

/* nagrody — zdjęcia: wrzuć pliki do folderu img/ */
const V='?v=3'; // zmień numer, jeśli podmienisz zdjęcia (omija cache przeglądarki)
const WIN  ={title:'Klopsiki',img:'img/klopsiki-studio.webp'+V,emoji:'🫙',val:'Wartość: bezcenna',win:true};
const MERC ={title:'Mercedes-Benz',img:'img/mercedes.jpg'+V,emoji:'🚘',val:'Wartość: 800 000 zł'};
const FLAT ={title:'Mieszkanie w Szczecinie',img:'img/mieszkanie.jpg'+V,emoji:'🏢',val:'Wartość: 650 000 zł'};

function ph(e){const d=document.createElement('div');d.className='ph';d.textContent=e;return d}

/* wczytaj i zdekoduj zdjęcia od razu po otwarciu strony */
const PRELOAD={};
[WIN,MERC,FLAT].forEach(p=>{
  const im=new Image();im.decoding='async';im.src=p.img;
  PRELOAD[p.img]={im,ok:true,ready:im.decode().catch(()=>{PRELOAD[p.img].ok=false})};
});
const allReady=()=>Promise.all(Object.values(PRELOAD).map(o=>o.ready));

function frontHTML(p){
  const pic=`<img src="${p.img}" alt="${p.title}" loading="eager" decoding="async" onerror="this.replaceWith(ph('${p.emoji}'))">`;
  return `<div class="pic">${pic}</div>
  <div class="info"><h3>${p.title}</h3><div class="val${p.win?' win':''}">${p.val}</div></div>`;
}

const wraps=[...document.querySelectorAll('.card-wrap')];
const cards=wraps.map(w=>w.querySelector('.card'));
const hint=document.getElementById('hint'),after=document.getElementById('after');
const veil=document.getElementById('veil'),rays=document.getElementById('rays'),zoom=document.getElementById('zoom');
const ribbon=document.getElementById('ribbon'),closeBtn=document.getElementById('close');
const mobile=()=>matchMedia('(max-width:760px)').matches;
let picked=-1,busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* zdjęcia siedzą w kartach od początku strony (już wczytane i narysowane) */
const fronts=wraps.map(w=>w.querySelector('.front'));
const order=[WIN,MERC,FLAT].sort(()=>Math.random()-.5);
fronts.forEach((f,j)=>f.innerHTML=frontHTML(order[j]));
function swapFronts(a,b){
  const tmp=document.createDocumentFragment();
  tmp.append(...fronts[a].childNodes);
  fronts[a].append(...fronts[b].childNodes);
  fronts[b].append(...tmp.childNodes);
  [order[a],order[b]]=[order[b],order[a]];
}

wraps.forEach((w,i)=>w.addEventListener('click',()=>choose(i)));

async function choose(i){
  if(busy||picked>-1)return;
  busy=true;picked=i;
  // zwycięzcą zawsze jest wybrana karta: podmień jej zawartość z kartą z klopsikami
  const wj=order.indexOf(WIN);
  if(wj!==i)swapFronts(i,wj);
  wraps.forEach(w=>w.classList.add('locked'));
  hint.textContent='…';
  // 1) napięcie: tylko wybrana karta drży, reszta ciemnieje
  cards.forEach((c,j)=>{if(j!==i)c.classList.add('dim')});
  cards[i].classList.add('tense');
  await Promise.all([wait(3300),allReady(),
    ...[...document.querySelectorAll('.front img')].map(im=>im.decode().catch(()=>{}))]);
  cards[i].classList.remove('tense');
  cards[i].querySelector('.back').style.animation='none';
  // 2) odsłanianie po kolei: 1, 2, 3
  hint.textContent='';
  for(let j=0;j<3;j++){
    cards[j].classList.remove('dim');cards[j].classList.add('flipped');
    await wait(1100);
  }
  await wait(500);
  // 3) zwycięska karta leci na ekran
  await zoomIn();
}

async function zoomIn(){
  const r=wraps[picked].getBoundingClientRect();
  zoom.innerHTML='<div class="face front">'+frontHTML(WIN)+'</div>';
  zoom.style.visibility='visible';
  veil.classList.add('on');rays.classList.add('on');
  const zr=zoom.getBoundingClientRect();
  document.documentElement.style.setProperty('--zh',zr.height+'px');
  const s=r.width/zr.width;
  const dx=(r.left+r.width/2)-(zr.left+zr.width/2),dy=(r.top+r.height/2)-(zr.top+zr.height/2);
  const a=zoom.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:'translate(0,0) scale(1)'}],
    {duration:1100,easing:'cubic-bezier(.2,.9,.25,1.08)',fill:'forwards'});
  await a.finished;
  zoom.classList.add('float');
  ribbon.classList.add('on');closeBtn.classList.add('on');
  blast();clearInterval(window._cf);window._cf=setInterval(()=>blast(true),1800);
  busy=false;
}
function closeZoom(){
  clearInterval(window._cf);
  ribbon.classList.remove('on');closeBtn.classList.remove('on');
  veil.classList.remove('on');rays.classList.remove('on');
  zoom.style.visibility='hidden';zoom.classList.remove('float');zoom.getAnimations().forEach(a=>a.cancel());
  after.classList.add('show');
  after.scrollIntoView({behavior:'smooth',block:'center'});
}
closeBtn.addEventListener('click',closeZoom);
addEventListener('keydown',e=>{if(e.key==='Escape'&&veil.classList.contains('on'))closeZoom()});
document.getElementById('seeprize').addEventListener('click',()=>{if(picked>-1&&!busy){busy=true;zoomIn()}});
document.getElementById('again').addEventListener('click',()=>{
  after.classList.remove('show');
  cards.forEach(c=>{c.classList.remove('flipped','dim','tense');c.querySelector('.back').style.animation=''});
  wraps.forEach(w=>w.classList.remove('locked'));
  picked=-1;busy=false;hint.innerHTML='&nbsp;';
  document.getElementById('pick').scrollIntoView({behavior:'smooth'});
});

/* konfetti */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
let W,H,parts=[],raf=null;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const COLS=['#e8cf8b','#c9a24a','#f6efe0','#1f6b4f','#8fd1b0','#e8745a','#ffffff'];
function blast(small){
  const n=(small?50:150)*(W<600?.7:1);
  for(let s=0;s<2;s++)for(let i=0;i<n/2;i++){
    const v=9+Math.random()*11,a=.5+Math.random()*.7;
    parts.push({x:s?W+10:-10,y:H*.8,vx:(s?-1:1)*Math.cos(a)*v,vy:-Math.sin(a)*v*1.25,
      w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:COLS[(Math.random()*COLS.length)|0],o:Math.random()<.25,life:0});
  }
  for(let i=0;i<n/2;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
    w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,
    c:COLS[(Math.random()*COLS.length)|0],o:Math.random()<.3,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.y<H+40&&p.life<600);
  for(const p of parts){
    p.life++;p.vy+=.22;p.vx*=.992;p.vy*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.o){cx.beginPath();cx.arc(0,0,p.w/2.2,0,7);cx.fill()}
    else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3)+.2));
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,W,H),null);
}
</script>
